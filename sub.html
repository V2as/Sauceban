<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrap{text-align:center;padding:32px}
.spinner{width:48px;height:48px;border:4px solid #21262d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 24px}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:20px;font-weight:600;margin-bottom:8px}
p{color:#8b949e;font-size:14px;margin-bottom:20px}
a{color:#58a6ff;text-decoration:none;font-size:14px}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
<div class="spinner"></div>
<h1>Подключение...</h1>
<p>Перенаправление в приложение</p>
<a id="fallback" href="#">Открыть вручную</a>
</div>
<script>
(function(){
    var url = window.location.href;
    var deep = 'blacktemple://import/' + url;
    document.getElementById('fallback').href = deep;
    window.location.href = deep;
})();
</script>
</body>
</html>
